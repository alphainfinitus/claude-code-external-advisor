# Runs the runner's regression suite. The tests stub `gh`, `cursor-agent`, `agy` and `codex` as
# shell scripts on PATH and keep every repository under the OS temp directory, so a runner needs
# nothing but git and Node: no network, no account with any vendor, no secrets.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that PR's previous run. Pushes to main fall back to the
# unique run id, so every commit on main keeps its own result instead of cancelling the one before.
concurrency:
  group: tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      # Report every combination, rather than hiding the rest behind the first failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          # No `cache:` key: the runner is stdlib-only, so there is no lockfile to cache from.

      - name: Node and git versions
        run: |
          node --version
          git --version

      - run: node --test run.test.mjs

  # Separate from the test matrix on purpose: this job needs the Claude Code CLI, and installing it
  # four times across the 2x2 matrix would dwarf a suite that finishes in seconds.
  validate:
    name: plugin manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - run: npm install -g @anthropic-ai/claude-code

      # Validate the directory, not .claude-plugin/plugin.json. With both manifests present this
      # runs as a marketplace check, which still reaches plugin.json through the entry but skips
      # the plugin-root CLAUDE.md warning that would otherwise fail --strict.
      - run: claude plugin validate . --strict
